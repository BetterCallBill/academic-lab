<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#1e3a5f"/>
  <!-- Hexagon shape representing nanostructure -->
  <polygon
    points="32,10 50,21 50,43 32,54 14,43 14,21"
    fill="none"
    stroke="#0d9488"
    stroke-width="3"
  />
  <!-- Inner lines -->
  <line x1="32" y1="10" x2="32" y2="32" stroke="#14b8a6" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="21" x2="32" y2="32" stroke="#14b8a6" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="43" x2="32" y2="32" stroke="#14b8a6" stroke-width="1.5" opacity="0.6"/>
  <line x1="32" y1="54" x2="32" y2="32" stroke="#14b8a6" stroke-width="1.5" opacity="0.6"/>
  <line x1="14" y1="43" x2="32" y2="32" stroke="#14b8a6" stroke-width="1.5" opacity="0.6"/>
  <line x1="14" y1="21" x2="32" y2="32" stroke="#14b8a6" stroke-width="1.5" opacity="0.6"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="#0d9488"/>
  <!-- Vertex dots -->
  <circle cx="32" cy="10" r="2.5" fill="#14b8a6"/>
  <circle cx="50" cy="21" r="2.5" fill="#14b8a6"/>
  <circle cx="50" cy="43" r="2.5" fill="#14b8a6"/>
  <circle cx="32" cy="54" r="2.5" fill="#14b8a6"/>
  <circle cx="14" cy="43" r="2.5" fill="#14b8a6"/>
  <circle cx="14" cy="21" r="2.5" fill="#14b8a6"/>
</svg>
